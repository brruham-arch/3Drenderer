name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 + armv7
        run: |
          BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          FLAGS="-shared -fPIC -O2 -std=c++17 -fvisibility=hidden -static-libstdc++"
          $BIN/aarch64-linux-android24-clang++ $FLAGS -Wl,-z,max-page-size=16384 \
            -o libb3d.so src/b3d.cpp -lEGL -lGLESv2 -llog -ldl
          $BIN/armv7a-linux-androideabi21-clang++ $FLAGS \
            -o libb3d_v7.so src/b3d.cpp -lEGL -lGLESv2 -llog -ldl
          file libb3d.so libb3d_v7.so
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest libb3d.so libb3d_v7.so --title latest --notes "auto build"
